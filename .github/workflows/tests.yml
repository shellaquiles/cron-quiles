name: Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --all-extras

      - name: Run tests
        run: uv run pytest tests/ -v

      - name: Check code style (optional)
        run: |
          uv run flake8 src/ --count --select=E9,F63,F7,F82 --show-source --statistics
          uv run flake8 src/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

  # Branch protection en main exige el contexto exacto "test".
  # La matriz solo publica "test (3.10)", "test (3.11)", "test (3.12)".
  test-gate:
    name: test
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Confirmar que la matriz pasó
        run: |
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "La matriz de tests falló: ${{ needs.test.result }}"
            exit 1
          fi
